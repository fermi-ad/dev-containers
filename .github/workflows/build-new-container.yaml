name: Upload new image

on: 
  workflow_dispatch:
    inputs:
      language:
        required: true
        type: choice
        options:
        - flutter
        - python
        - rust-kafka
        - rust
        # Add new options as dev containers for new languages are created
      version:
        required: true 
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out Dockerfiles
        uses: actions/checkout@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: adregistry.fnal.gov/dev-containers/${{ inputs.language }}
          tags: |
            # This is the default tag for the last commit
            type=edge
            # This sets the latest tag and version tag 
            type=raw,value=latest,enable=true 
            type=raw,value=${{ inputs.version }},enable=true 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to AD Registry, Harbor
        uses: docker/login-action@v2 
        with:
          registry: adregistry.fnal.gov 
          username: ${{ secrets.ADREGISTRY_USERNAME }}
          password: ${{ secrets.ADREGISTRY_SECRET }}

      - name: Build image and push to adregistry 
        uses: docker/build-push-action@v4 
        with:
          context: ./${{ inputs.language }}
          push: true 
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
