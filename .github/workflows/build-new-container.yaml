name: Upload new image

on: 
  workflow_dispatch:
    inputs:
      language:
        required: true
        type: choice
        options:
        - ap-python
        - flutter
        - python
        - rust-kafka
        - rust
        # Add new options as dev containers for new languages are created
      version:
        required: true 
        type: string

jobs:
  build-and-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checking out Dockerfiles
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: adregistry.fnal.gov/dev-containers/${{ inputs.language }}
          tags: |
            type=raw,value=${{ inputs.version }}-${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to AD Registry, Harbor
        uses: docker/login-action@v3 
        with:
          registry: adregistry.fnal.gov 
          username: ${{ secrets.ADREGISTRY_USERNAME }}
          password: ${{ secrets.ADREGISTRY_SECRET }}

      - name: Build image and push to adregistry 
        uses: docker/build-push-action@v7 
        with:
          context: ./${{ inputs.language }}
          platforms: linux/${{ matrix.arch }}
          push: true 
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: adregistry.fnal.gov/dev-containers/${{ inputs.language }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to AD Registry
        uses: docker/login-action@v4
        with:
          registry: adregistry.fnal.gov
          username: ${{ secrets.ADREGISTRY_USERNAME }}
          password: ${{ secrets.ADREGISTRY_SECRET }}

      - name: Create Multi-Arch Manifest
        run: |
          docker buildx imagetools create \
            $(echo "${{ steps.meta.outputs.tags }}" | xargs -I {} echo "-t {}") \
            adregistry.fnal.gov/dev-containers/${{ inputs.language }}:${{ inputs.version }}-amd64 \
            adregistry.fnal.gov/dev-containers/${{ inputs.language }}:${{ inputs.version }}-arm64
